# tixforge template: tixforge-pr-link (v1). Installed by /tixforge:project init.
# A server-side check that a pull request from a tixforge branch closes its
# ticket's issue. The local guard hook can be bypassed; this cannot, once
# the check is required in branch protection.
#   branch GT-<number>-<slug>  ->  body must contain Closes / Fixes / Resolves #<number>
# GT-000123 is issue #123. Other branches (LT- tickets, anything else) pass.
name: tixforge-pr-link

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Check Closes #<ticket>
        env:
          HEAD_REF: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$HEAD_REF" in
            GT-[0-9]*-*) ;;
            *) echo "$HEAD_REF is not the branch of a GitHub ticket"; exit 0 ;;
          esac
          d=${HEAD_REF#GT-}; d=${d%%-*}
          n=$(printf '%s' "$d" | sed 's/^0*//')
          if printf '%s\n' "$BODY" | grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#${n}([^0-9]|$)"; then
            echo "closes #$n"
          else
            echo "::error::The PR body must contain \"Closes #$n\" (branch $HEAD_REF)."
            exit 1
          fi
