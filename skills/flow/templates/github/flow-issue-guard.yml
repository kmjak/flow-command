# flow-command template: flow-issue-guard (v1). Installed by /flow init
# together with .github/flow/ticket-hash.sh (a copy of the skill's script,
# so the hash is computed exactly as /flow computes it).
#
# Runs on the GitHub event `issues: edited`: someone changed an issue's
# title or body. /flow writes a hash of the title + ticket into the body
# (<!-- flow:hash:... -->) whenever it syncs. When the hash no longer
# matches, the issue was edited on GitHub instead of through /flow edit:
# the issue gets the label flow:out-of-sync and one comment. /flow dev and
# /flow edit see the label, show the difference and ask whether to adopt it.
# When /flow syncs again the hash matches and the label is removed.
name: flow-issue-guard

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    if: contains(github.event.issue.body, 'flow:ticket:start') || contains(join(github.event.issue.labels.*.name, ','), 'flow:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/flow/ticket-hash.sh
          sparse-checkout-cone-mode: false
      - name: Compare the hash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          h=.github/flow/ticket-hash.sh
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if bash "$h" extract < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/ticket.md"; then
            if stored=$(bash "$h" stored < "$RUNNER_TEMP/body.md"); then
              now=$(bash "$h" hash "$TITLE" < "$RUNNER_TEMP/ticket.md")
              if [ "$now" = "$stored" ]; then ok=1; else ok=0; fi
            else
              ok=1   # an issue made before hashes: nothing to compare
            fi
          else
            ok=0     # the markers are gone
          fi
          case ",$LABELS," in *,flow:out-of-sync,*) labeled=1 ;; *) labeled=0 ;; esac
          if [ $ok -eq 1 ]; then
            [ $labeled -eq 1 ] && gh issue edit "$NUMBER" --remove-label flow:out-of-sync
            exit 0
          fi
          [ $labeled -eq 1 ] && exit 0   # already reported
          gh issue edit "$NUMBER" --add-label flow:out-of-sync
          gh issue comment "$NUMBER" --body "このチケットの本文またはタイトルが GitHub 上で直接編集されました（flow:out-of-sync）。次に /flow dev か /flow edit を実行したときに差分を確認し、取り込むかを選べます。今後の変更は /flow edit で行ってください。 / This ticket was edited on GitHub. /flow dev or /flow edit will show the difference and ask whether to adopt it; please use /flow edit for changes."
